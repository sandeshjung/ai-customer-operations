services:
  postgres:
    image: postgres:16
    container_name: customer-operations-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_operations
      POSTGRES_USER: customer_admin
      POSTGRES_PASSWORD: customer_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U customer_admin -d customer_operations",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: customer-operations-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: customer-operations-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: customer-operations-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI — http://localhost:16686
      - "4318:4318" # OTLP HTTP receiver

  api:
    build: .
    container_name: customer-operations-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: customer_admin
      redis_url: redis://redis:6379/0
      QDRANT_HOST: qdrant
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "uv run alembic -c alembic.ini upgrade head &&
             uv run uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000"

  worker:
    build: .
    container_name: customer-operations-worker
    restart: unless-stopped
    labels:
      - "autoheal=true"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: customer_admin
      redis_url: redis://redis:6379/0
      QDRANT_HOST: qdrant
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8001:8001" # health check — curl http://localhost:8001/health to inspect manually
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    command: ["sh", "backend/scripts/start_worker.sh"]

  autoheal:
    image: willfarrell/autoheal
    container_name: customer-operations-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  redis_data:
  qdrant_data: